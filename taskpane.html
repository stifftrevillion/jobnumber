<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Job Number</title>
  <script src="https://officeapis.public.onecdn.static.microsoft/1/office.js"></script>
  <style>
    :root {
      --text: #242424;
      --muted: #616161;
      --border: #d1d1d1;
      --bg: #ffffff;
      --hover: #f0f0f0;
      --accent: #0f6cbd;
      --accent-text: #ffffff;
      --selected: #ebf3fc;
      --ok: #107c10;
      --warn: #8a5300;
      --error: #c50f1f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: #f0f0f0;
        --muted: #adadad;
        --border: #4a4a4a;
        --bg: #1f1f1f;
        --hover: #2e2e2e;
        --accent: #479ef5;
        --accent-text: #0b0b0b;
        --selected: #0e3a5e;
        --ok: #54b054;
        --warn: #f2c661;
        --error: #f1707b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", sans-serif;
      font-size: 14px;
      color: var(--text);
      background: var(--bg);
    }
    label { display: block; font-weight: 600; margin: 0 0 4px; }
    input[type="text"], input[type="search"] {
      width: 100%;
      padding: 7px 9px;
      font: inherit;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
    #results {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      max-height: 45vh;
      overflow-y: auto;
      border: 1px solid var(--border);
      border-radius: 4px;
    }
    #results:empty { display: none; }
    #results li {
      padding: 7px 9px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    #results li:last-child { border-bottom: none; }
    #results li:hover, #results li:focus { background: var(--hover); outline: none; }
    #results li.selected { background: var(--selected); }
    #results li.empty { color: var(--muted); cursor: default; font-style: italic; }
    #results li.empty:hover { background: transparent; }
    .tag { color: var(--muted); font-size: 12px; white-space: nowrap; }
    #editor { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); }
    .hint { color: var(--muted); font-size: 12px; margin: 4px 0 0; }
    .row { display: flex; align-items: center; gap: 6px; margin: 10px 0 0; font-weight: normal; }
    .row input { margin: 0; }
    button {
      margin-top: 12px;
      width: 100%;
      padding: 8px 12px;
      font: inherit;
      font-weight: 600;
      color: var(--accent-text);
      background: var(--accent);
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    a { color: var(--accent); }
    .status { margin-top: 10px; min-height: 1.2em; font-size: 13px; color: var(--muted); }
    .status.ok { color: var(--ok); }
    .status.warn { color: var(--warn); }
    .status.error { color: var(--error); }
  </style>
</head>
<body>
  <label for="search">Find a job</label>
  <input id="search" type="search" placeholder="Type a number or name" autocomplete="off" />
  <ul id="results"></ul>

  <div id="editor" hidden>
    <label for="jobText">Text to add to the subject</label>
    <input id="jobText" type="text" autocomplete="off" />
    <p class="hint">Folder name: <span id="folderName"></span> <a href="#" id="resetLink" hidden>Use folder name</a></p>
    <label class="row"><input id="remember" type="checkbox" /> Remember my version for this job</label>
    <button id="addButton" type="button">Add to subject</button>
  </div>

  <div id="status" class="status" role="status"></div>

  <script src="taskpane.js"></script>
</body>
</html>
